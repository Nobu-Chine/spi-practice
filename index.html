<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPI非言語 練習</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main class="app">
    <section id="screen-home" class="screen">
      <h1>SPI非言語 練習</h1>
      <p id="home-lead" class="muted"></p>
      <h2>分野を選ぶ</h2>
      <div id="mode-list" class="button-list"></div>
      <h2>これまでの成績</h2>
      <div id="history-summary"></div>
      <button id="clear-history" type="button" class="link-button" hidden>成績の記録を消す</button>
    </section>

    <section id="screen-question" class="screen" hidden>
      <div class="q-head">
        <span><span id="q-progress"></span>・<span id="q-category"></span></span>
        <button id="quit-button" type="button" class="link-button">やめる</button>
      </div>
      <div id="timer" class="timer">
        <div class="timer-bar"><div id="timer-fill"></div></div>
        <span id="timer-text"></span>
      </div>
      <p id="q-text" class="q-text"></p>
      <div id="choice-list" class="button-list"></div>
      <div id="feedback" class="feedback" hidden>
        <p id="fb-verdict" class="verdict"></p>
        <p id="fb-answer" class="fb-answer"></p>
        <p id="fb-mistake" class="mistake" hidden></p>
        <ol id="fb-steps" class="steps"></ol>
        <div class="copy-row">
          <button id="copy-button" type="button" class="secondary">AIに質問用にコピー</button>
          <p id="copy-message" class="copy-message" role="status" aria-live="polite"></p>
        </div>
        <button id="next-button" type="button" class="primary"></button>
      </div>
    </section>

    <section id="screen-result" class="screen" hidden>
      <h1>結果</h1>
      <p id="r-rate" class="score"></p>
      <p id="r-detail"></p>
      <p id="r-time" class="muted"></p>
      <h2>分野別</h2>
      <div id="r-categories"></div>
      <button id="retry-button" type="button" class="primary">同じ分野でもう一度</button>
      <button id="home-button" type="button" class="secondary">分野選択に戻る</button>
    </section>
  </main>
</body>
</html>
